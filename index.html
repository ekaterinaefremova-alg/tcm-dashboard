<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TCM Dashboard v5</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0f1117;color:#e0e0e0;padding:20px;min-height:100vh}
h1{font-size:24px;font-weight:700;margin-bottom:4px;color:#fff}
.sub{font-size:13px;color:#666;margin-bottom:24px}
.btn{padding:6px 14px;font-size:12px;border-radius:8px;border:1px solid #333;background:#1a1d27;color:#ccc;cursor:pointer}
.btn:hover{background:#252833}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#34a853}
.stx{font-size:12px;color:#888}
.sec{background:linear-gradient(135deg,#1a1d27,#252833);border-radius:16px;padding:24px;margin-bottom:24px;border:1px solid #2a2d3a}
.sec-t{font-size:18px;font-weight:700;color:#fff;margin-bottom:16px}
.big{font-size:56px;font-weight:800;color:#fff;line-height:1}
.big-l{font-size:14px;color:#888;margin-top:4px;margin-bottom:16px}
.stats{display:flex;gap:16px;flex-wrap:wrap}
.stat{background:#1a1d27;border-radius:12px;padding:12px 20px;border:1px solid #2a2d3a;min-width:120px}
.stat .n{font-size:24px;font-weight:700}
.stat .l{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.cd{background:#1a1d27;border-radius:16px;padding:20px;border:1px solid #2a2d3a;transition:transform .2s}
.cd:hover{transform:translateY(-2px)}
.tn{font-size:16px;font-weight:700;color:#fff;margin-bottom:4px}
.tt{font-size:36px;font-weight:800;color:#fff;margin-bottom:12px}
.tl{font-size:11px;color:#666;margin-bottom:12px}
.sr{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1f2230}
.sr:last-child{border:none}
.sn{font-size:13px;display:flex;align-items:center;gap:8px}
.sb{width:10px;height:10px;border-radius:3px}
.sc{font-size:16px;font-weight:700}
.pw{margin-top:12px}
.pb{height:8px;border-radius:4px;background:#0f1117;overflow:hidden;display:flex}
.ps{height:100%;transition:width .5s}
.ld{text-align:center;padding:80px 20px}
.sp{font-size:36px;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.eb{background:#2a1515;border:1px solid #5a2020;border-radius:12px;padding:20px;margin:20px 0}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.g4{grid-template-columns:1fr}}
.lw{display:flex;justify-content:center;align-items:center;min-height:80vh}
.lb{background:#1a1d27;border:1px solid #2a2d3a;border-radius:16px;padding:40px;width:100%;max-width:380px;text-align:center}
.lb h2{font-size:20px;color:#fff;margin-bottom:8px}
.lb p{font-size:13px;color:#666;margin-bottom:24px}
.li{width:100%;padding:12px 16px;border-radius:10px;border:1px solid #333;background:#0f1117;color:#fff;font-size:14px;outline:none;margin-bottom:12px}
.li:focus{border-color:#4285f4}
.lbn{width:100%;padding:12px;border-radius:10px;border:none;background:#4285f4;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.lbn:hover{background:#3275e4}
.le{color:#ea4335;font-size:13px;margin-top:8px;display:none}
.lg{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.pc{background:#0f1117;border-radius:14px;padding:20px;text-align:center}
.pn{font-size:14px;font-weight:600;color:#fff;margin-bottom:12px}
.pnm{display:flex;justify-content:center;align-items:baseline;gap:6px;margin-bottom:8px}
.pf{font-size:36px;font-weight:800}
.pp{font-size:18px;color:#666}
.pbg{height:10px;border-radius:5px;background:#1f2230;overflow:hidden;margin-top:10px}
.pfl{height:100%;border-radius:5px;transition:width .6s}
.ptc{background:#0f1117;border-radius:14px;padding:20px;margin-bottom:16px}
.ptn{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ptb{font-size:32px;font-weight:800}
.ptp{font-size:28px;font-weight:800}
.dct{width:100%;border-collapse:collapse;margin-top:16px}
.dct th{text-align:left;padding:10px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#666;border-bottom:2px solid #2a2d3a}
.dct td{padding:10px 12px;font-size:14px;border-bottom:1px solid #1f2230}
.dct tr:last-child td{border:none}
.dct .nm{font-weight:700;text-align:center}
.dct-tot td{font-weight:700;border-top:2px solid #2a2d3a;font-size:15px}
</style>
</head>
<body>
<div id="login"><div class="lw"><div class="lb">
<h2>&#128274; TCM Dashboard</h2>
<p>Введите пароль для доступа</p>
<input type="password" class="li" id="pi" placeholder="Пароль" onkeydown="if(event.key==='Enter')doLogin()">
<button class="lbn" onclick="doLogin()">Войти</button>
<div class="le" id="er">Неверный пароль</div>
</div></div></div>
<div id="app" style="display:none"><div class="ld"><div class="sp">&#9203;</div>
<div style="font-size:18px;font-weight:600;color:#888;margin-top:12px">Загрузка...</div></div></div>
<script>
var PASS="tcmlatam2026";
var API_KEY="AIzaSyCnzz6tG4bJCCyRuQ5oTddeDEpDg-PShko";
var SHEET_ID="1gp8zaHuu_ctZeJnSpehLDaoYpDzzY5MvvmPdp9sp3Mk";
var TEAM_NAMES=["Florencia","Misael","Belen","Jesus"];
var TEAM_PLAN=14;
var STATUSES=["Working","Test Period","Probation","On-boarding"];
var FACT_ST=["Working","Test Period"];
var COL={"Working":"#34a853","Test Period":"#b39ddb","Probation":"#fbbc04","On-boarding":"#4fc3f7"};
var lu=null,dEL=null,dTM=null,teamErr="";

function doLogin(){
var v=document.getElementById("pi").value;
if(v===PASS){document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";loadAll();setInterval(loadAll,60000);}
else{document.getElementById("er").style.display="block";document.getElementById("pi").value="";}
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function cl(r,i){if(!r||i>=r.length)return"";return String(r[i]||"").trim()}
function mst(raw){var s=raw.toLowerCase();if(s.indexOf("exit")>=0)return"Exiting";if(s.indexOf("work")>=0)return"Working";if(s.indexOf("test")>=0)return"Test Period";if(s.indexOf("prob")>=0)return"Probation";if(s.indexOf("on")>=0&&s.indexOf("bo")>=0)return"On-boarding";return"";}
function pfc(p){if(p>=90)return"#34a853";if(p>=70)return"#fbbc04";return"#ea4335";}
function pad(rows,cnt,cols){var o=[];for(var i=0;i<cnt;i++){if(i<rows.length){var r=rows[i].slice();while(r.length<cols)r.push("");o.push(r);}else{var e=[];for(var j=0;j<cols;j++)e.push("");o.push(e);}}return o;}

function findBlocks(rows){
var hd=[];
for(var i=0;i<rows.length;i++){if(cl(rows[i],1).toLowerCase()==="member type")hd.push(i);}
var bl=[];
for(var j=0;j<hd.length&&j<TEAM_NAMES.length;j++){
var s=hd[j]+1,en;
if(j+1<hd.length){en=hd[j+1]-1;}
else{en=rows.length-1;for(var k=s;k<rows.length;k++){if(cl(rows[k],0).toLowerCase()==="\u043f\u043b\u0430\u043d"){en=k-1;break;}}}
bl.push({nm:TEAM_NAMES[j],s:s,e:en});
}
return bl;
}

function parseEL(rows,s,en){
var r={t:0,f:0,st:{}};STATUSES.forEach(function(x){r.st[x]=0});
for(var i=s;i<=en&&i<rows.length;i++){
var nm=cl(rows[i],2),raw=cl(rows[i],3);
if(!nm)continue;var m=mst(raw);if(!m||m==="Exiting")continue;
r.t++;r.st[m]++;if(FACT_ST.indexOf(m)>=0)r.f++;
}
return r;
}

function findPlan(rows){
for(var i=0;i<rows.length;i++){if(cl(rows[i],0).toLowerCase()==="\u043f\u043b\u0430\u043d"){for(var c=1;c<=5;c++){var v=parseInt(cl(rows[i],c).replace(/[^0-9]/g,""));if(v>0)return v;}}}
return 0;
}

function parseTM(rows){
var r={teams:{},tots:{}};STATUSES.forEach(function(x){r.tots[x]=0});
for(var i=1;i<rows.length;i++){
var ld=cl(rows[i],0),raw=cl(rows[i],5);
if(!raw)continue;var m=mst(raw);if(!m||m==="Exiting")continue;if(STATUSES.indexOf(m)<0)continue;
r.tots[m]++;
if(!ld)continue;
var k=ld.charAt(0).toUpperCase()+ld.slice(1).toLowerCase();
if(!r.teams[k]){r.teams[k]={};STATUSES.forEach(function(x){r.teams[k][x]=0});}
r.teams[k][m]++;
}
return r;
}

function loadAll(){
var u1="https://sheets.googleapis.com/v4/spreadsheets/"+SHEET_ID+"/values/Employee%20list!A1:G250?key="+API_KEY;
var u2="https://sheets.googleapis.com/v4/spreadsheets/"+SHEET_ID+"/values/Team!A1:H500?key="+API_KEY;
teamErr="";

fetch(u1).then(function(r){if(!r.ok)throw new Error("Employee list: "+r.status);return r.json();}).then(function(j1){
dEL=pad(j1.values||[],250,7);
return fetch(u2).then(function(r){if(!r.ok){teamErr="Team sheet: "+r.status;return{values:[]};}return r.json();}).then(function(j2){
dTM=pad(j2.values||[],500,8);
});
}).then(function(){
lu=new Date();
render();
}).catch(function(err){
document.getElementById("app").innerHTML='<div class="eb"><div style="font-size:18px;margin-bottom:8px">&#10060; Ошибка</div><div style="color:#f88">'+esc(err.message)+'</div><button class="btn" onclick="loadAll()" style="margin-top:12px">Попробовать снова</button></div>';
});
}

function render(){
if(!dEL){loadAll();return}
var rows=dEL;
var bl=findBlocks(rows);
var td=[],gT=0,gF=0,gS={};
STATUSES.forEach(function(x){gS[x]=0});
bl.forEach(function(b){var p=parseEL(rows,b.s,b.e);td.push({nm:b.nm,t:p.t,f:p.f,st:p.st});gT+=p.t;gF+=p.f;STATUSES.forEach(function(x){gS[x]+=p.st[x]});});
var tP=findPlan(rows);
var h="";

h+='<div style="display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:8px;margin-bottom:20px">';
h+='<div><h1>&#128202; TCM Dashboard v5</h1><div class="sub">4 команды · Обновление каждые 60 сек</div></div>';
h+='<div style="display:flex;align-items:center;gap:8px">';
if(lu){h+='<div class="dot"></div><span class="stx">'+lu.toLocaleTimeString("ru-RU")+'</span>';}
h+='<button class="btn" onclick="loadAll()">&#128260; Обновить</button></div></div>';

h+='<div class="sec"><div class="sec-t">&#128203; Выполнение плана найма</div>';
var tp=tP>0?Math.round(gF/tP*100):0,tc=pfc(tp);
h+='<div class="ptc"><div class="ptn"><div><span class="ptb" style="color:'+tc+'">'+gF+'</span><span style="color:#666;font-size:18px"> / '+tP+'</span></div>';
h+='<div class="ptp" style="color:'+tc+'">'+tp+'%</div></div>';
h+='<div style="font-size:13px;color:#888;margin-bottom:8px">Общий факт / план</div>';
h+='<div class="pbg"><div class="pfl" style="width:'+Math.min(tp,100)+'%;background:'+tc+'"></div></div></div>';
h+='<div class="g4">';
td.forEach(function(t){var p=TEAM_PLAN>0?Math.round(t.f/TEAM_PLAN*100):0,c2=pfc(p);
h+='<div class="pc"><div class="pn">'+esc(t.nm)+'</div><div class="pnm"><span class="pf" style="color:'+c2+'">'+t.f+'</span><span class="pp">/ '+TEAM_PLAN+'</span></div>';
h+='<div style="font-size:20px;font-weight:700;color:'+c2+'">'+p+'%</div>';
h+='<div class="pbg"><div class="pfl" style="width:'+Math.min(p,100)+'%;background:'+c2+'"></div></div></div>';
});
h+='</div></div>';

h+='<div class="sec"><div class="big">'+gT+'</div><div class="big-l">Всего сотрудников TCM</div>';
h+='<div class="stats">';
STATUSES.forEach(function(x){h+='<div class="stat"><div class="n" style="color:'+COL[x]+'">'+gS[x]+'</div><div class="l">'+x+'</div></div>';});
h+='</div>';
if(gT>0){h+='<div class="pw"><div class="pb">';STATUSES.forEach(function(x){var p=gS[x]/gT*100;if(p>0)h+='<div class="ps" style="width:'+p+'%;background:'+COL[x]+'"></div>';});h+='</div></div>';}
h+='</div>';

h+='<div class="g4">';
td.forEach(function(t){
h+='<div class="cd"><div class="tn">'+esc(t.nm)+'</div><div class="tt">'+t.t+'</div><div class="tl">сотрудников</div>';
STATUSES.forEach(function(x){if(t.st[x]>0){h+='<div class="sr"><div class="sn"><div class="sb" style="background:'+COL[x]+'"></div>'+x+'</div><div class="sc" style="color:'+COL[x]+'">'+t.st[x]+'</div></div>';}});
if(t.t>0){h+='<div class="pw"><div class="pb">';STATUSES.forEach(function(x){var p=t.st[x]/t.t*100;if(p>0)h+='<div class="ps" style="width:'+p+'%;background:'+COL[x]+'"></div>';});h+='</div></div>';}
h+='</div>';
});
h+='</div>';

h+='<div class="lg">';
STATUSES.forEach(function(x){h+='<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#888"><div style="width:10px;height:10px;border-radius:3px;background:'+COL[x]+'"></div>'+x+'</div>';});
h+='</div>';

/* ========== DOUBLE CHECK ========== */
h+='<div class="sec">';
h+='<div class="sec-t">&#128269; Дабл чек (лист Team)</div>';

if(teamErr){
h+='<div style="color:#ea4335;font-size:14px">Ошибка загрузки листа Team: '+esc(teamErr)+'</div>';
}else if(dTM&&dTM.length>1){
var dc=parseTM(dTM);
h+='<div style="font-size:13px;color:#666;margin-bottom:16px">Сверка с вкладкой Team</div>';
h+='<div style="overflow-x:auto"><table class="dct"><tr><th>Команда</th>';
STATUSES.forEach(function(x){h+='<th style="text-align:center;color:'+COL[x]+'">'+x+'</th>';});
h+='<th style="text-align:center">Всего</th></tr>';

var dcG=0,dcGS={};STATUSES.forEach(function(x){dcGS[x]=0});
TEAM_NAMES.forEach(function(tn){
var tm=null;for(var k in dc.teams){if(k.toLowerCase()===tn.toLowerCase()){tm=dc.teams[k];break;}}
if(!tm){tm={};STATUSES.forEach(function(x){tm[x]=0});}
var rt=0;STATUSES.forEach(function(x){var v=tm[x]||0;rt+=v;dcGS[x]+=v;});dcG+=rt;
h+='<tr><td style="font-weight:600">'+esc(tn)+'</td>';
STATUSES.forEach(function(x){var v=tm[x]||0;h+='<td class="nm" style="color:'+(v>0?COL[x]:"#444")+'">'+v+'</td>';});
h+='<td class="nm" style="color:#fff">'+rt+'</td></tr>';
});

h+='<tr class="dct-tot"><td>Итого</td>';
STATUSES.forEach(function(x){h+='<td class="nm" style="color:'+COL[x]+'">'+dcGS[x]+'</td>';});
h+='<td class="nm" style="color:#fff">'+dcG+'</td></tr></table></div>';

var match=gT===dcG;
h+='<div style="margin-top:16px;padding:14px 20px;border-radius:12px;background:#0f1117;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">';
h+='<div style="font-size:14px;color:#888">Employee list: <span style="color:#fff;font-weight:700">'+gT+'</span> &#8596; Team: <span style="color:#fff;font-weight:700">'+dcG+'</span></div>';
if(match){h+='<div style="color:#34a853;font-weight:700;font-size:14px">&#9989; Совпадает</div>';}
else{var df=gT-dcG;h+='<div style="color:#ea4335;font-weight:700;font-size:14px">&#9888; Расхождение: '+(df>0?"+":"")+df+'</div>';}
h+='</div>';
}else{
h+='<div style="color:#888;font-size:14px">Нет данных с листа Team</div>';
}
h+='</div>';
/* ========== END DOUBLE CHECK ========== */

document.getElementById("app").innerHTML=h;
}
</script>
</body>
</html>
